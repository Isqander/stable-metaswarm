[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-metaswarm"
version = "0.1.0"
description = "Durable orchestrator for CLI agents from multiple vendors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["metaswarm*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "9.1"
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["./fixtures", "./refs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pre-P1 design-check helpers keep their established style; E/F remain enabled.
"scripts/checks/*.py" = ["I001", "UP020", "UP022", "UP031"]
